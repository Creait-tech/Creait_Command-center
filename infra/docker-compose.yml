# Local-dev / repo-root compose file for the CREAIT MCP server.
#
# NOTE: this file is for running the MCP container from the repo on your
# laptop. It is NOT used on the VPS — see infra/mcp.vps.compose.yml for
# the production layout (which expects sources rsynced to /opt/creait-mcp).
#
# Requires a .env at /etc/creait-mcp/.env (or change env_file) with:
#   MCP_TOKEN=...
#   DATA_DIR=/data
#   GETCREAIT_PIT=...           (optional — GHL tools return 503 if missing)
#   GETCREAIT_LOCATION_ID=XJuOjmYZEFS65kTCilsH

services:
  creait-mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    image: creait-mcp:latest
    container_name: creait-mcp
    restart: unless-stopped
    env_file:
      - /etc/creait-mcp/.env
    volumes:
      - /opt/creait-mcp/data:/data
    ports:
      - "8080:8080"
